<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>Promptly | Find internships while they're still fresh</title>
    <meta
      name="description"
      content="Promptly sends you alerts when internships and early-career opportunities go live, so you can find them while they're still fresh."
    />
    <link rel="canonical" href="https://joinpromptly.co/" />

    <!-- Tab icon: the Promptly bolt. SVG for modern browsers, ICO/PNG as fallback. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: preconnect so the stylesheet and the font file don't
         pay for two separate connection handshakes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..900;1,14..32,400..900&display=swap"
    />

    <!-- Social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Promptly" />
    <meta property="og:url" content="https://joinpromptly.co/" />
    <meta property="og:title" content="Promptly | Find internships while they're still fresh" />
    <meta
      property="og:description"
      content="Promptly sends you alerts when internships and early-career opportunities go live, so you can find them while they're still fresh."
    />
    <meta property="og:image" content="https://joinpromptly.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Promptly | Find internships while they're still fresh" />
    <meta
      name="twitter:description"
      content="Promptly sends you alerts when internships and early-career opportunities go live, so you can find them while they're still fresh."
    />
    <meta name="twitter:image" content="https://joinpromptly.co/og-image.png" />

    <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "Promptly",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "url": "https://joinpromptly.co/",
        "description": "Promptly sends students alerts when internships and early-career opportunities go live.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
